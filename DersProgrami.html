.side{max-height:82vh;overflow:auto;padding:2px}

}

    else h+='<section>'+arr.map(({o,i})=>`<div class=row style="align-items:center;margin:0 0 8px"><input style="flex:1" value="${esc(o.name)}" onchange="grn(${i},this.value)"><small class=mu>${S.les.filter(l=>gk(l.g)==gk(o.name)).length} ${t('les')}</small><button class=d onclick="gdel(${i})">${t('del')}</button></div>`).join('')+'</section>';
  }
  if(tab=='les'){
    h+=`<h2>${t('les')}</h2>`;
    if(!S.tch.length)h+=`<p class=mu>${t('need')}</p>`;
    else if(!archive)h+=`<section><div class=row><label>${t('t1')}<select id=lt>${opt(S.tch,S.tch[0]&&S.tch[0].id)}</select></label><label>${t('subj')}<input id=ls></label><label>${t('g1')}<select id=lg><option value="">—</option>${S.grs.map(o=>`<option value="${esc(o.name)}">${esc(o.name)}</option>`).join('')}</select></label><label>${t('hrs')}<input id=lh type=number min=1 value=2></label><label>${t('blk')}<input id=lb type=number min=1 value=2></label><button onclick=addL()>${t('add')}</button></div></section>`;
    if(!archive&&S.les.length){
      const sortVal=getSortMode('les');
      const sortOpts=[['az',t('sortAz')],['za',t('sortZa')],['tch',t('sortTch')],['hrs',t('sortHrs')]];
      h+=`<section><div class=row style="align-items:center">
        <label>${t('translateLang')}<select onchange="setTranslateTL(this.value)"><option value="tr" ${translateTL=='tr'?'selected':''}>Türkçe</option><option value="en" ${translateTL=='en'?'selected':''}>English</option><option value="ar" ${translateTL=='ar'?'selected':''}>العربية</option><option value="fr" ${translateTL=='fr'?'selected':''}>Français</option></select></label>
        <button class=g onclick="translateAll()">${t('translateAll')}</button>
        <label>${t('sort')}<select onchange="setSort('les',this.value)">${sortOpts.map(([v,l])=>`<option value="${v}" ${sortVal===v?'selected':''}>${l}</option>`).join('')}</select></label>
      </div></section>`;
    }
    if(S.les.length){
      h+=`<section><table class=l2><tr><th>${t('t1')}</th><th>${t('les1')}</th><th>${t('tr_col')}</th><th>${t('n1')}</th><th>${t('blk')}</th><th></th></tr>`;
      h+=sortedLesIdx().map(({o:l,i})=>{
        if(editingLesson===i&&!archive){
          return `<tr><td><select id="e_t">${S.tch.map(o=>`<option value="${o.id}" ${o.id==l.t?'selected':''}>${esc(o.name)}</option>`).join('')}</select></td><td><input id="e_sub" class="tr-cell" value="${esc(l.sub)}"></td><td><input id="e_tr" class="tr-cell" value="${esc(l.tr||'')}"></td><td><input id="e_h" class="tr-cell" type=number min=1 value="${l.h}"></td><td><input id="e_b" class="tr-cell" type=number min=1 value="${l.b}"></td><td><button class=g onclick="saveL(${i})">💾 ${t('save')}</button> <button class=g onclick="cancelEdit()">✕</button></td></tr>`;
        }
        const action=archive?`<button class=g onclick="setLessonClipboardById(${l.id})" title="${t('copy_lesson')}">📋</button>`:`<button class=g onclick="translateLesson(${i})" title="${t('translate')}">🌐</button> <button class=g onclick="editL(${i})" title="${t('edit')}">✏️</button> <button class=d onclick="delL(${i})">${t('del')}</button>`;
        return `<tr><td>${esc(nm('t',l.t))}</td><td>${esc(l.sub)}</td><td><input class="tr-cell" value="${esc(l.tr||'')}" onchange="setTr(${i},this.value)" placeholder="—" ${archive?'disabled':''}></td><td>${l.h}</td><td>${l.b>=l.h?t('single'):l.b}</td><td>${action}</td></tr>`;
      }).join('');
      h+='</table></section>';
    }
  }
  if(tab=='prg'){
    const list=vw.t=='c'?sortedClsIdx().map(z=>z.o):vw.t=='t'?sortedTchIdx().map(z=>z.o):sortedGrsIdx().map(z=>({id:gk(z.o.name),name:z.o.name}));
    if(!list.find(o=>o.id==vw.id))vw.id=list[0]&&list[0].id;const rem=S.les.reduce((a,l)=>a+left(l),0);
    const o=list.find(q=>q.id==vw.id),[A,B]=o?prog(vw.t,o.id):[0,0],C=vw.t=='c';
    const off=o&&vw.t!='g'?Object.keys(byId(C?'cls':'tch',o.id).off).filter(k=>S.set.dayOn[+k.split(',')[0]]).length:0;
    const side=list.map(q=>{const [a,b]=prog(vw.t,q.id),sb=vw.t=='t'?(q.mail||''):vw.t=='g'?S.les.filter(l=>gk(l.g)==q.id).length+' '+t('les'):'';
      const cp=archive&&vw.t==='t'?`<button class="copy-btn" onclick="event.stopPropagation();setTeacherClipboard(${q.id})" title="${t('copy_teacher')}">📋</button>`:'';
      return `<div class="ec ${q.id==vw.id?'on':''}" data-id="${esc(q.id)}" onclick="pick(this.dataset.id)">${cp}<div class=who><span class=av style="background:${avc(q.name)}">${esc(ini(q.name))}</span><div><b>${esc(q.name)}</b><small>${esc(sb)}</small></div></div><div class=bar><i class=y style="width:${b?Math.min(100,a/b*100):0}%"></i></div></div>`}).join('');
    const tool=`<div class=tool><div class=seg>${[['c','c1'],['t','t1'],['g','g0']].map(([v,l])=>`<button class="${vw.t==v?'on':''}" onclick="vw.t='${v}';vw.id=null;ed=null;R()">${t(l)}</button>`).join('')}</div><span class=sp></span>${archive?'':`<button onclick=gen()>${t('gen')}</button>${rem>0&&S.sch.length?`<button class=g onclick=gen(1)>${t('gen2')}</button>`:''}<button class=d onclick=clr()>${t('clr')}</button><button class=g onclick=asave()>${t('asave')}</button>`}</div>`;
    const pv=[[A,'plc','py'],[Math.max(0,B-A),C?'fre':'unp','pk'],[off,'cls0','pz']].map(([v,l,c])=>`<div style="flex:${Math.max(v,3)} 1 0;min-width:96px"><small class=mu>${t(l)}</small><div class="pill ${c}">${v} ${t('hr')}</div></div>`).join('');
    const mid=`<div class=mid>${tool}${msg}${rem>0&&S.sch.length?`<p class=mu>${t('rem0')}: ${rem}</p>`:''}`+(!S.les.length?`<p class=mu>${t('nop')}</p>`:o?`<section><div class=big>${A}<small> / ${B} ${t('hr')}</small></div><div class=pills>${pv}</div><p class=mu style="margin:10px 0 4px">${t('tap')}</p>${edp()}${tbl(vw.t,vw.id,1)}${lsum(vw.t,vw.id)}</section>`:'')+'</div>';
    const gl=o?S.les.filter(l=>vw.t=='t'?l.t==o.id:gk(l.g)==o.id):[];
    const info=!o?[]:vw.t=='t'?[[t('mail'),o.mail||'—'],[t('les'),gl.length],[t('hrs'),B]]:vw.t=='g'?[[t('les'),gl.length],[t('t1'),new Set(gl.map(l=>l.t)).size],[t('hrs'),B]]:[[t('les'),new Set(S.sch.filter(p=>p.c==o.id).map(p=>p.l)).size],[t('hrs'),A+' / '+B]];
    const days=o?new Set(S.sch.filter(p=>mt(p,vw.t,o.id)).map(p=>p.d)).size:0,nd=DV().length;
    const bars=[[t('plc'),A+' / '+B,B?A/B*100:0,'y'],[t('dayu'),days+' / '+nd,nd?days/nd*100:0,'k']].map(([l,v,w,c])=>`<div class=kv><span>${l}</span><b>${v}</b></div><div class=bar><i class=${c} style="width:${Math.min(100,w)}%"></i></div>`).join('');
    const copyTch=archive&&vw.t==='t'&&o?`<div class=row><button onclick="setTeacherClipboard(${o.id})">📋 ${t('copy_teacher')}</button></div>`:'';
    const prof=o?`<aside class=prof><div class=ban></div><span class="av big" style="background:${avc(o.name)}">${esc(ini(o.name))}</span><h3>${esc(o.name)}</h3><p class="mu ctr">${tl(vw.t)}</p>
      <h4>${t('info')}</h4>${info.map(([k,v])=>`<div class=kv><span>${k}</span><b>${esc(v)}</b></div>`).join('')}
      ${copyTch}
      <h4>${t('docs')}</h4><div class=docs><button class="doc dw" onclick="wd('cur')"><i>W</i>Word</button><button class="doc dx" onclick="xl('cur')"><i>X</i>Excel</button><button class="doc dp" onclick="pdf('cur')"><i>P</i>PDF</button></div>
      <h4>${t('stat')}</h4>${bars}
      <h4>${t('outh')}</h4><div class=row style="margin:0 0 8px"><select onchange="fmt=this.value;R()">${[['xl','Excel'],['wd','Word'],['pdf','PDF']].map(([v,n])=>`<option value=${v} ${fmt==v?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class=row>${[['tch','allt'],['grp','allg'],['cls','allc']].map(([k,l])=>`<button class=g onclick="${fmt}('${k}')">${t(l)}</button>`).join('')}</div>
      <div class=row><button onclick=sendAll()>${t('send')}</button></div><p class=mu>${t('sendn')}</p></aside>`:'<aside></aside>';
    h+=`<h2>${t('prg')}</h2><div class=pg3><aside class=side>${side||`<p class=mu>${t('none')}</p>`}</aside>${mid}${prof}</div>`}
  if(tab=='arc'&&!archive){
    h+=`<h2>${t('arc')}</h2><section><div class=row>${yf()}<button onclick=asave()>${t('asave')}</button></div><p class=mu>${t('anote')}</p></section>`;
    if(!S.arc.length)h+=`<p class=mu>${t('none')}</p>`;
    else h+=`<section><table class=l2><tr><th>${t('yr0')}</th><th>${t('sm')}</th><th>${t('sv')}</th><th>${t('nl')}</th><th></th></tr>`+S.arc.map((e,i)=>[e,i]).reverse().map(([e,i])=>`<tr><td>${esc(e.year)}</td><td>${t('sem'+e.sem)}</td><td>${e.date}</td><td>${(e.snap&&e.snap.les||[]).length}</td><td><button class=g onclick="aopen(${i})">${t('aopen')}</button> <button class=d onclick="adel(${i})">${t('del')}</button></td></tr>`).join('')+'</table></section>'}
  document.getElementById('app').innerHTML=h+'</main></div>';
  if(fid&&document.getElementById(fid)){try{const el=document.getElementById(fid);el.focus();if(sel&&el.setSelectionRange)el.setSelectionRange(sel[0],sel[1])}catch(e){}}
}

setL(LI);
S=loadDev()||blank();init();
TABS=[{id:'cur',isArchive:false,state:S}];
activeTabId='cur';
started=true;
let ses=null;try{ses=JSON.parse(localStorage.getItem('dpses'))}catch(e){}
if(ses&&ses.email&&ses.tok&&remOn()){user={pv:ses.pv,tok:ses.tok,email:ses.email,name:ses.name,until:ses.until,exp:ses.until>Date.now()+20000?0:1}}
R();
